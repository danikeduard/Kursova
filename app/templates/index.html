<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI English Tutor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">AI English Tutor</div>
        <div class="level-indicator" id="levelIndicator">LEVEL: BEGINNER</div>

        <div id="chat">
            <div class="msg bot" id="welcome">Hello! I'm your personal AI tutor. 🤖
Select your level below and we'll start training! 🚀
💡 Need feedback? Type /analysis at any time to get a report on your progress and tips on what to learn.</div>
        </div>

        <div class="input-area">
            <div class="lvl-selector">
                <button class="lvl-btn active" data-level="beginner">Beginner</button>
                <button class="lvl-btn" data-level="intermediate">Intermediate</button>
                <button class="lvl-btn" data-level="advanced">Advanced</button>
            </div>
            <div class="input-row">
                <input type="text" id="userInput" placeholder="Напишіть щось..." autocomplete="off">
                <button id="send-btn">OK</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
