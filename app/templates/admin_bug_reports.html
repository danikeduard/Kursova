<!doctype html>
<html lang="en" class="chat-page" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Admin — LinguaPath</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/motion.css') }}">
</head>
<body class="app-body feedback-body admin-feedback-body">
  <div class="mobile-scrim" id="mobile-scrim" hidden></div>
  {% include "_sidebar.html" %}
  <main class="app-main">
    <header class="topbar"><button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Open menu">☰</button><strong>Admin</strong><div class="topbar-levels"><a class="progress-link" href="{{ url_for('main.chat') }}">Back to chat <span>↗</span></a></div></header>
    <section class="feedback-stage">
      <div class="feedback-admin-content">
        <nav class="admin-tab-switcher" aria-label="Admin sections"><a href="{{ url_for('main.admin_feedback') }}">Feedback</a><a href="{{ url_for('main.admin_bug_reports_page') }}" class="active">Bug reports</a></nav>
        <section id="bug-admin-summary" class="feedback-summary" aria-label="Bug report summary"></section>
        <article class="feedback-chart-card bug-category-chart"><h2>Reports by category</h2><canvas id="bug-category-chart" role="img" aria-label="Bug reports by category"></canvas></article>
        <form id="bug-admin-filters" class="bug-admin-filters">
          <label>Status<select name="status"><option value="">All</option>{% for status in bug_statuses %}<option value="{{ status }}">{{ status.replace('_',' ') }}</option>{% endfor %}</select></label>
          <label>Category<select name="category"><option value="">All</option>{% for category in bug_categories %}<option value="{{ category }}">{{ category }}</option>{% endfor %}</select></label>
          <label>From<input name="date_from" type="date"></label><label>To<input name="date_to" type="date"></label>
          <label>Search<input name="q" type="search" placeholder="Title, description, or email"></label>
          <label>Sort<select name="sort"><option value="date_desc">Newest</option><option value="date_asc">Oldest</option><option value="status">Status</option></select></label>
          <button type="submit">Apply</button>
          <a id="bug-export" href="{{ url_for('main.admin_bug_reports_export') }}">Export CSV</a>
        </form>
        <section class="feedback-table-card"><div class="feedback-table-wrap"><table><thead><tr><th>ID</th><th>Date</th><th>Email</th><th>Participant</th><th>Category</th><th>Preview</th><th>Status</th><th>Page</th></tr></thead><tbody id="bug-admin-rows"></tbody></table></div><nav id="bug-admin-pagination" class="feedback-pagination"></nav></section>
      </div>
    </section>
  </main>
  <div class="bug-detail-backdrop" id="bug-detail-backdrop" hidden><section class="bug-detail-panel" id="bug-detail-panel" role="dialog" aria-modal="true" aria-labelledby="bug-detail-title"><button id="bug-detail-close" type="button" aria-label="Close">×</button><h2 id="bug-detail-title">Bug report</h2><div id="bug-detail-content"></div><form id="bug-detail-form"><label>Status<select id="bug-detail-status" name="status">{% for status in bug_statuses %}<option value="{{ status }}">{{ status.replace('_',' ') }}</option>{% endfor %}</select></label><label>Internal admin note<textarea id="bug-detail-note" maxlength="2000"></textarea></label><p id="bug-detail-error" class="bug-error" hidden></p><button type="submit">Save</button></form></section></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous"></script>
  <script type="module" src="{{ url_for('static', filename='js/admin_bug_reports.js') }}"></script>
</body>
</html>
